<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LedgerDesk replaces spreadsheets and email for small accounting firms: AI-assisted document capture, human-approved posting, bank reconciliation and month-end reporting." />
    <meta name="theme-color" content="#fafaf7" />
    <title>LedgerDesk</title>
    <script>
      // Applied before first paint so dark mode never flashes. Light is the default.
      (function () {
        var pref = null
        try { pref = localStorage.getItem('ledgerdesk:theme') } catch (e) {}
        document.documentElement.dataset.theme = pref === 'dark' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
